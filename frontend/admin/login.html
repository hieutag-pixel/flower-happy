<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản trị | Flowers Happy</title>
  <link rel="icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-login">
  <form class="login-card" id="adminLoginForm">
    <img src="/images/logo-sm.png" alt="Flowers Happy" class="login-logo">
    <h1>Đăng nhập quản trị</h1>
    <p class="muted">Chỉ dành cho tài khoản quản trị viên của cửa hàng.</p>
    <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username"></div>
    <div class="field"><label>Mật khẩu</label><input type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-block">Đăng nhập</button>
    <a href="/" class="back-link"><span data-icon="arrowLeft"></span>Về trang web</a>
  </form>

  <div id="toast"></div>
  <script>window.ADMIN_PAGE = true;</script>
  <script src="/js/common.js"></script>
  <script src="/admin/admin-auth.js"></script>
  <script src="/admin/login.js"></script>
</body>
</html>
