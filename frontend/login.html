<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Flowers Happy</title>
  <link rel="icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <form class="panel auth-box" id="loginForm">
      <h1 style="text-align:center">Đăng nhập</h1>
      <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
      <div class="field"><label>Mật khẩu</label><input type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-block">Đăng nhập</button>
      <p style="text-align:center" class="muted">Chưa có tài khoản? <a href="/register.html" style="color:var(--brown);font-weight:600">Đăng ký</a></p>
    </form>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
