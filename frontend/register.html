<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | Flowers Happy</title>
  <link rel="icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <form class="panel auth-box" id="registerForm">
      <h1 style="text-align:center">Tạo tài khoản</h1>
      <div class="field"><label>Họ tên</label><input name="fullName" required></div>
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field"><label>Số điện thoại</label><input name="phone" pattern="0[0-9]{9}" title="10 số, bắt đầu bằng 0"></div>
      <div class="field"><label>Mật khẩu</label><input type="password" name="password" minlength="6" required></div>
      <div class="field"><label>Nhập lại mật khẩu</label><input type="password" name="confirm" minlength="6" required></div>
      <button class="btn btn-block">Đăng ký</button>
      <p style="text-align:center" class="muted">Đã có tài khoản? <a href="/login.html" style="color:var(--brown);font-weight:600">Đăng nhập</a></p>
    </form>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
